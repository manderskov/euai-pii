name: euai-pii-production

services:
  screening:
    build:
      context: ${EUAI_PII_SOURCE}
    configs:
      - source: screening_config
        target: /run/config/screening.json
    environment:
      SCREENING_PORT: "8080"
      SCREENING_CONFIG_PATH: /run/config/screening.json
      SCREENING_CREDENTIAL: ${SCREENING_CREDENTIAL:?SCREENING_CREDENTIAL must be set in .env}
    ports:
      - "${SCREENING_BIND_ADDRESS}:${SCREENING_HOST_PORT}:8080"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 2.0
    mem_limit: 2g
    restart: on-failure
    networks:
      - screening_private

configs:
  screening_config:
    file: ${SCREENING_CONFIG_FILE:-/home/morten/code/euai-pii/config/screening.example.json}

networks:
  screening_private:
    internal: false
