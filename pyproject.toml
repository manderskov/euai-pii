[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "euai-pii"
version = "0.1.0"
description = "Private local text screening service for EUAI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "presidio-analyzer==2.2.364",
    "spacy==3.8.16",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
